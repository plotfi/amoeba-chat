# attohttpd configuration.  "key = value", one per line; # starts a comment.

# Interface to bind.  Loopback by default; set 0.0.0.0 to expose the server.
bind = 127.0.0.1
port = 1337

# Directory holding one encrypted transcript per room.
chat_dir = chats

# Worker threads, and the memory knobs.  On a small VPS keep these low --
# see OPERATIONS.md for the sizing.
# threads       = 4
# max_blob_mb   = 5
# max_memory_mb = 40

# Host this server answers to; requests with another Host get 421.
# hostname = chat.example.org

# TLS.  Both must be set to enable HTTPS (required for anything but localhost,
# since browsers withhold WebCrypto from a plain-HTTP remote origin).
# tls_cert = /path/to/fullchain.pem
# tls_key  = /path/to/privkey.pem
